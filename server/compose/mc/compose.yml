services:
  mc:
    image: itzg/minecraft-server
    ports:
      - "25565:25565"
    user: "1000:1000"
    environment:
      # DEBUG: "true"                    # Enable debug logging
      # LOG_LEVEL: "DEBUG"               # Set log level
      # MODS_FILE_LOG_LEVEL: "DEBUG"     # Debug for mod file operations
      # MC_HELPER_LOG_LEVEL: "DEBUG"
      MODRINTH_DEFAULT_EXCLUDE_INCLUDES: ""
      EULA: TRUE
      MODPACK_PLATFORM: "MODRINTH"
      TYPE: NEOFORGE
      VERSION: 1.21.1
      MEMORY: 12G
      MODRINTH_MODPACK: "/data/revolution_1.0.0.mrpack"
      JVM_OPTS: -javaagent:injector.jar=ely.by
    volumes:
      - ./data:/data
    restart: always
