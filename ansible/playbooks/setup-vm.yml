- name: Setup users and SSH
  hosts: all
  become: true

  collections:
    - devsec.hardening

  tasks:
    - name: Change root password
      user:
        name: root
        password: "{{ root_user_password | password_hash('sha512') }}"

    - name: Create/update user 'main'
      user:
        name: main
        password: "{{ main_user_password | password_hash('sha512') }}"
        shell: /bin/bash

    - name: Grant sudo rights to 'main'
      lineinfile:
        path: /etc/sudoers
        line: "main ALL=(ALL) NOPASSWD:ALL"
        validate: 'visudo -cf %s'

    - name: Add public key to 'main'
      authorized_key:
        user: main
        state: present
        key: "{{ main_public_key }}"

    - name: Apply SSH hardening from dev-sec collection
      include_role:
        name: devsec.hardening.ssh_hardening

- name: Set up apt and cron
  hosts: de:ru
  become: true

  tasks:
    - name: Fail if no mirror URL defined for this host's group
      ansible.builtin.fail:
        msg: "No apt_mirror_url defined for host {{ inventory_hostname }} (groups: {{ group_names }})"
      when: apt_mirror_url is not defined

    - name: Check if ubuntu.sources (DEB822 format) exists
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/ubuntu.sources
      register: deb822_sources

    - name: Replace mirror URLs in ubuntu.sources
      ansible.builtin.replace:
        path: /etc/apt/sources.list.d/ubuntu.sources
        regexp: 'https?://([a-zA-Z0-9-]+\.)?archive\.ubuntu\.com/ubuntu/?|https?://security\.ubuntu\.com/ubuntu/?'
        replace: "{{ apt_mirror_url }}"
      when: deb822_sources.stat.exists

    - name: Replace mirror URLs in sources.list
      ansible.builtin.replace:
        path: /etc/apt/sources.list
        regexp: 'https?://([a-zA-Z0-9-]+\.)?archive\.ubuntu\.com/ubuntu/?|https?://security\.ubuntu\.com/ubuntu/?'
        replace: "{{ apt_mirror_url }}"
      when: not deb822_sources.stat.exists

    - name: Update APT cache after replacing mirrors
      ansible.builtin.apt:
        update_cache: true

    - name: Schedule weekly APT automatic updates
      ansible.builtin.cron:
        name: "Weekly automatic APT updates"
        minute: "{{ reboot_minute }}"
        hour: "{{ reboot_hour }}"
        weekday: "0"
        job: "apt-get update && apt-get upgrade -y && apt-get autoremove -y && apt-get clean"
        state: present

    - name: Schedule weekly system reboot (GMT)
      ansible.builtin.cron:
        name: "Weekly system reboot"
        minute: "{{ reboot_minute }}"
        hour: "{{ reboot_hour }}"
        weekday: "0"
        job: "/sbin/shutdown -r now"
        state: present

    - name: Ensure specified packages are installed
      ansible.builtin.apt:
        name: "{{ packages_to_install }}"
        state: present
        update_cache: true

- name: Configure shell
  hosts: all
  become: true
  vars:
    target_user: "main"
    target_user_home: "/home/{{ target_user }}"

  tasks:
    - name: Check if Oh My Zsh is already installed
      ansible.builtin.stat:
        path: "{{ target_user_home }}/.oh-my-zsh"
      register: oh_my_zsh_stat

    - name: Download Oh My Zsh installer
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh
        dest: /tmp/install_ohmyzsh.sh
        mode: '0755'
      when: not oh_my_zsh_stat.stat.exists

    - name: Install Oh My Zsh for target user
      ansible.builtin.command: /tmp/install_ohmyzsh.sh --unattended
      become: true
      become_user: "{{ target_user }}"
      when: not oh_my_zsh_stat.stat.exists

    - name: Install zsh-autosuggestions plugin
      ansible.builtin.git:
        repo: https://github.com/zsh-users/zsh-autosuggestions
        dest: "{{ target_user_home }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
        depth: 1
      become: true
      become_user: "{{ target_user }}"

    - name: Install zsh-syntax-highlighting plugin
      ansible.builtin.git:
        repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
        dest: "{{ target_user_home }}/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"
        depth: 1
      become: true
      become_user: "{{ target_user }}"

    - name: Install or update Starship prompt
      ansible.builtin.shell:
        cmd: curl -fsSL https://starship.rs/install.sh | sh -s -- --yes
        creates: /usr/local/bin/starship

    - name: Ensure custom .zshrc configuration is set
      ansible.builtin.blockinfile:
        path: "{{ target_user_home }}/.zshrc"
        create: true
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0644'
        marker: "# {mark} ANSIBLE MANAGED ZSH CONFIG"
        block: |
          export ZSH="$HOME/.oh-my-zsh"
          ZSH_THEME=""

          plugins=(
              git
              zsh-autosuggestions
              zsh-syntax-highlighting
          )

          source $ZSH/oh-my-zsh.sh
          eval "$(starship init zsh)"

    - name: Change default shell to Zsh for target user
      ansible.builtin.user:
        name: "{{ target_user }}"
        shell: /bin/zsh

