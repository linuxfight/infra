volumes:
  netbird-client:

networks:
  hop:
    driver: bridge

services:
  netbird:
    restart: unless-stopped
    container_name: netbird-connector
    image: netbirdio/netbird:latest
    env_file: .env
    volumes:
      - netbird-client:/var/lib/netbird
    cap_add:
      - NET_ADMIN
    networks:
      - hop
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
