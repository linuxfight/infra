# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  ansible:apply:
    silent: true
    dir: ansible
    cmds:
      - ansible-playbook -i inventory/servers.ini playbooks/setup.yml

  cloud:apply:
    silent: true
    dir: cloud
    dotenv:
      - .env
    cmds:
      - tofu apply -auto-approve

  cloud:plan:
    dir: cloud
    dotenv:
      - .env
    cmds:
      - tofu plan

  encrypt:
    silent: true
    vars:
      HASH_MANIFEST: '.sops-hashes.json'
      FILES_RAW:
        sh: |
          find . -type f \
            \( \
            -name "*.env" -o \
            -name "secrets.nix" -o \
            -name "secrets.yml" -o \
            -name "config.json" -o \
            -name "*.tfstate" -o \
            -name "*.tfstate.backup" \
            \) | grep -v backups | grep -v '\.enc$'
    cmds:
      - |
        MANIFEST="{{.HASH_MANIFEST}}"
        [ -f "$MANIFEST" ] || echo '{}' > "$MANIFEST"

        changed=0

        echo "{{.FILES_RAW}}" | while IFS= read -r file; do
          [ -z "$file" ] && continue

          current_hash=$(sha256sum "$file" | awk '{print $1}')
          stored_hash=$(jq -r --arg f "$file" '.[$f] // empty' "$MANIFEST")

          if [ -f "${file}.enc" ] && [ "$current_hash" = "$stored_hash" ]; then
            echo "Skipping ${file} (unchanged)"
            continue
          fi

          echo "Encrypting ${file} → ${file}.enc"
          sops -e "$file" > "${file}.enc"
          git add "${file}.enc"

          tmp=$(mktemp)
          jq --arg f "$file" --arg h "$current_hash" '.[$f] = $h' "$MANIFEST" > "$tmp" && mv "$tmp" "$MANIFEST"
        done

        git add "$MANIFEST"
